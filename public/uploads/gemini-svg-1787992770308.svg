<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="hc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a2b"/>
      <stop offset="100%" stop-color="#06030c"/>
    </linearGradient>
    <radialGradient id="core-glow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#hc-bg)"/>
  <!-- Isometric Grid Board -->
  <g transform="translate(640, 320) scale(1, 0.5) rotate(45)">
    <rect x="-240" y="-240" width="480" height="480" fill="#1e1838" stroke="#7928ca" stroke-width="4"/>
    <!-- Center Core Tiles -->
    <rect x="-60" y="-60" width="120" height="120" fill="#00f0ff" fill-opacity="0.3" stroke="#00f0ff" stroke-width="4"/>
  </g>
  <circle cx="640" cy="320" r="180" fill="url(#core-glow)"/>
  <!-- Clash Icons (Knight vs King) -->
  <text x="510" y="340" fill="#00f0ff" font-size="120" font-family="'Segoe UI Symbol', sans-serif" filter="drop-shadow(0 0 25px #00f0ff)">♞</text>
  <text x="670" y="340" fill="#ff0077" font-size="120" font-family="'Segoe UI Symbol', sans-serif" filter="drop-shadow(0 0 25px #ff0077)">♚</text>
  <!-- Kinetic Slash -->
  <line x1="440" y1="420" x2="840" y2="220" stroke="#ffffff" stroke-width="5" filter="drop-shadow(0 0 15px #00f0ff)"/>
  <!-- Badge & Titles -->
  <rect x="1050" y="40" width="190" height="38" rx="8" fill="#7928ca"/>
  <text x="1145" y="65" fill="#ffffff" font-family="'Inter', sans-serif" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="2">1v1 RANKED</text>
  <text x="60" y="610" fill="#ff0077" font-family="'Montserrat', sans-serif" font-size="18" font-weight="700" letter-spacing="4">KINETIC / MOBA CHESS</text>
  <text x="60" y="660" fill="#ffffff" font-family="'Montserrat', sans-serif" font-size="44" font-weight="900" letter-spacing="1">HYPER-CHESS</text>
</svg>
