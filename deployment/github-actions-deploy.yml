# ==============================================================================
# GitHub Actions Automated Deployment Workflow
#
# How to use:
# 1. Place this file in your repository at: .github/workflows/deploy.yml
# 2. In your GitHub Repo -> Settings -> Secrets and variables -> Actions, add:
#    - WINDOWS_SERVER_IP: Your Windows server's public IP
#    - WINDOWS_SERVER_USER: Your Windows administrator username
#    - WINDOWS_SERVER_PASSWORD: Your Windows administrator password (or SSH Key)
# 3. Whenever you push to 'main', GitHub will trigger deploy.ps1 automatically!
# ==============================================================================

name: Deploy to Windows Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Live Server
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Remote Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.WINDOWS_SERVER_IP }}
          username: ${{ secrets.WINDOWS_SERVER_USER }}
          password: ${{ secrets.WINDOWS_SERVER_PASSWORD }}
          port: 22
          script: |
            powershell -ExecutionPolicy Bypass -File C:\apps\Ultimatum\deployment\deploy.ps1
